[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-kv"
version = "0.1.0"
description = "A from-scratch Raft consensus key-value store with zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WuxieLUK"}]
keywords = ["raft", "distributed-systems", "key-value-store", "consensus", "fault-tolerance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
nimbus-kv = "nimbus_kv.cli:main"

[tool.setuptools.packages.find]
include = ["nimbus_kv*"]
